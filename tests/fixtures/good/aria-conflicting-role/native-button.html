<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Conflicting role — good (native tag, no contradictory role)</title>
  </head>
  <body>
    <!-- Button for actions, anchor for navigation — no role needed. -->
    <button type="button">Save</button>
    <a href="/docs">Read the docs</a>
    <nav aria-label="Primary">
      <a href="/">Home</a>
      <a href="/about">About</a>
    </nav>
  </body>
</html>
