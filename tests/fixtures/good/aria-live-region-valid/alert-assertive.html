<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Live region — good (alert)</title>
  </head>
  <body>
    <!--
      role="alert" implies aria-live="assertive". aria-relevant lists
      the events that should be announced; "additions text" is the
      ARIA-default and explicit here only for documentation.
    -->
    <div role="alert" aria-relevant="additions text" id="error-banner"></div>
  </body>
</html>
