name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }} · node-${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22", "24"]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify
        run: bun run verify

  # Invariants that only need to run once per push (not per-matrix).
  invariants:
    name: invariants
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify package.json dependencies is empty
        run: |
          deps=$(bun -e 'const p=require("./package.json"); console.log(Object.keys(p.dependencies ?? {}).length)')
          if [ "$deps" != "0" ]; then
            echo "::error::package.json.dependencies has $deps entries — must be 0"
            exit 1
          fi

      - name: Verify lockfile matches package.json
        run: bun install --frozen-lockfile

  # Self-scan: produce a SARIF report of ra11y's own source and upload it
  # to GitHub's Security tab. Eats our own dog food + gives contributors
  # an annotated view of any accessibility drift in examples/ and docs.
  self-scan:
    name: self-scan (sarif)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Scan src/ and emit SARIF
        run: bun src/cli.ts scan src/ --format sarif --fail-on never > ra11y.sarif

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ra11y.sarif
          category: ra11y-self-scan

  plugin-examples:
    name: plugin examples
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Example rule plugin
        run: cd examples/plugin-rule && bun test.ts

      - name: Example standard plugin
        run: cd examples/plugin-standard && bun test.ts

      - name: Example formatter plugin
        run: cd examples/plugin-formatter && bun test.ts
