name: Release

on:
  push:
    tags:
      - "v*"

# Only one release workflow runs at a time — avoid double-publish if
# a tag is pushed twice.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: npm publish (provenance)
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write  # for GitHub release creation
      id-token: write  # for npm provenance

    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify
        run: bun run verify

      - name: Build
        run: bun run build

      - name: Verify tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version v$pkg"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Generate changelog excerpt
        id: changelog
        run: |
          bun scripts/generate-changelog.ts > /tmp/release-notes.md
          echo "notes_path=/tmp/release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          body_path: ${{ steps.changelog.outputs.notes_path }}
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
