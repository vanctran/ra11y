version: 2
updates:
  # GitHub Actions updates
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci"
      include: scope

  # Dev dependencies (TypeScript, Biome, @types/*). Runtime deps are
  # empty by invariant — check-zero-deps.ts will fail any PR that
  # tries to add one.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    labels:
      - dependencies
      - dev-deps
    commit-message:
      prefix: "chore(deps)"
      include: scope
    open-pull-requests-limit: 5
    # Group minor + patch updates of dev tooling into one PR so the
    # review backlog stays manageable.
    groups:
      dev-tooling:
        patterns:
          - "@biomejs/*"
          - "@types/*"
          - "typescript"
        update-types:
          - minor
          - patch
